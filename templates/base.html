<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Expense Tracker{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #222;
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        button,
        .button {
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            background: #dff5e3;
            border-radius: 5px;
        }

        .danger {
            color: #b00020;
        }
    </style>
</head>

<body>

    <nav>
        <div>
            <a href="{% url 'expense-list' %}">
                <strong>Expense Tracker</strong>
            </a>
        </div>

        {% if user.is_authenticated %}
            <div>
                <span>Hello, {{ user.username }}</span>

                <form method="post"
                      action="{% url 'logout' %}"
                      style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            </div>
        {% endif %}
    </nav>

    <main class="container">

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
