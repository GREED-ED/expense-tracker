{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="card" style="max-width: 450px; margin: 40px auto; padding: 32px;">

    <h1 style="margin-top: 0; margin-bottom: 24px; font-size: 1.75rem;">Welcome Back</h1>

    {% if form.errors %}
        <div class="danger" style="background-color: #fdf2f2; border: 1px solid #f5c6cb; color: #a94442; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem;">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    <form method="post" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}

        <div class="form-container">
            {{ form.as_p }}
        </div>

        <button type="submit" style="width: 100%; padding: 10px; margin-top: 8px;">
            Login
        </button>
    </form>

    <div style="text-align: center; margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px;">
        <p style="color: #666; margin: 0; font-size: 0.95rem;">
            Don't have an account? 
            <a href="{% url 'register' %}" style="color: #0066cc; text-decoration: none; font-weight: 500;">Create one</a>
        </p>
    </div>

</div>

{% endblock %}
