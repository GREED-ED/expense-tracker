{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="card" style="max-width: 500px; margin: auto;">

    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if form.errors %}
            <p class="danger">
                Invalid username or password.
            </p>
        {% endif %}

        <button type="submit">
            Login
        </button>
    </form>

</div>

{% endblock %}
